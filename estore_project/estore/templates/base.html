<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LUXE Store{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0ece4;
    --muted: #888;
    --danger: #e05555;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; min-height:100vh; }
  a { color:inherit; text-decoration:none; }

  /* NAV */
  nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem; height:64px;
    background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:100;
  }
  .nav-logo { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:600; letter-spacing:.15em; color:var(--accent); }
  .nav-links { display:flex; gap:2rem; }
  .nav-links a { color:var(--muted); font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; transition:color .2s; }
  .nav-links a:hover { color:var(--text); }
  .cart-btn {
    display:flex; align-items:center; gap:.5rem;
    background:var(--accent); color:#0e0e0e;
    padding:.45rem 1.1rem; border-radius:2px;
    font-size:.75rem; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
    transition:background .2s;
  }
  .cart-btn:hover { background:var(--accent2); }
  .cart-count {
    background:#0e0e0e; color:var(--accent);
    border-radius:50%; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:.65rem; font-weight:700;
  }

  /* TOAST */
  #toast {
    position:fixed; bottom:2rem; right:2rem; z-index:999;
    background:var(--accent); color:#0e0e0e;
    padding:.75rem 1.5rem; border-radius:2px;
    font-size:.8rem; font-weight:500; letter-spacing:.05em;
    transform:translateY(100px); opacity:0; transition:all .3s;
  }
  #toast.show { transform:translateY(0); opacity:1; }

  /* FOOTER */
  footer {
    margin-top:5rem; padding:2rem 2.5rem;
    border-top:1px solid var(--border);
    color:var(--muted); font-size:.75rem; text-align:center; letter-spacing:.05em;
  }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-logo">LUXE</a>
  <div class="nav-links">
    <a href="/">Shop</a>
    <a href="/cart/">Cart</a>
  </div>
  <a href="/cart/" class="cart-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Bag <span class="cart-count" id="cart-count">0</span>
  </a>
</nav>

<div id="toast"></div>

{% block content %}{% endblock %}

<footer>© 2025 LUXE — Premium Goods</footer>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function updateCartCount(n) {
  document.getElementById('cart-count').textContent = n;
}
// Load cart count on page load
fetch('/cart/data/').then(r=>r.json()).then(d=>updateCartCount(d.total_items));
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
