{% extends 'base.html' %}
{% block title %}Your Bag — LUXE{% endblock %}
{% block extra_css %}
<style>
.cart-wrap { max-width:800px; margin:0 auto; padding:3rem 2.5rem; }
.cart-title { font-family:'Cormorant Garamond',serif; font-size:2.5rem; font-weight:300; margin-bottom:2rem; }
.cart-empty { text-align:center; color:var(--muted); padding:4rem 0; }
.cart-empty a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

.cart-item {
  display:grid; grid-template-columns:70px 1fr auto auto;
  gap:1.2rem; align-items:center;
  padding:1.2rem 0; border-bottom:1px solid var(--border);
}
.item-img { width:70px; height:70px; object-fit:cover; border-radius:2px; background:var(--surface2); }
.item-ph {
  width:70px; height:70px; background:var(--surface2); border-radius:2px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--border);
}
.item-name { font-size:.9rem; margin-bottom:.25rem; }
.item-price { color:var(--muted); font-size:.8rem; }

.qty-ctrl { display:flex; align-items:center; border:1px solid var(--border); border-radius:2px; }
.qty-btn { background:none; border:none; color:var(--text); width:28px; height:28px; cursor:pointer; font-size:.9rem; transition:background .15s; }
.qty-btn:hover { background:var(--surface2); }
.qty-val { width:32px; text-align:center; font-size:.8rem; background:none; border:none; color:var(--text); }

.item-total { font-size:.9rem; color:var(--accent); min-width:60px; text-align:right; }
.remove-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:.2rem; transition:color .2s; }
.remove-btn:hover { color:var(--danger); }

.cart-summary {
  margin-top:2rem; padding:1.5rem; background:var(--surface);
  border-radius:2px; border:1px solid var(--border);
}
.summary-row { display:flex; justify-content:space-between; margin-bottom:.75rem; font-size:.85rem; color:var(--muted); }
.summary-total { display:flex; justify-content:space-between; padding-top:.75rem; border-top:1px solid var(--border); font-family:'Cormorant Garamond',serif; font-size:1.4rem; }
.summary-total span:last-child { color:var(--accent); }
.checkout-btn {
  width:100%; margin-top:1.2rem; background:var(--accent); color:#0e0e0e;
  border:none; padding:.9rem; border-radius:2px;
  font-size:.8rem; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s;
}
.checkout-btn:hover { background:var(--accent2); }
.continue-link { display:block; text-align:center; margin-top:1rem; color:var(--muted); font-size:.75rem; text-decoration:underline; text-underline-offset:3px; }
.continue-link:hover { color:var(--text); }
</style>
{% endblock %}

{% block content %}
<div class="cart-wrap">
  <h1 class="cart-title">Your Bag</h1>
  <div id="cart-items"></div>
  <div id="cart-summary" style="display:none">
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span>Free</span></div>
      <div class="summary-total"><span>Total</span><span id="total">$0.00</span></div>
      <button class="checkout-btn" onclick="showToast('Checkout coming soon!')">Checkout</button>
    </div>
    <a href="/" class="continue-link">← Continue shopping</a>
  </div>
  <div id="cart-empty-msg" class="cart-empty" style="display:none">
    Your bag is empty. <a href="/">Browse the collection →</a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function getCookie(n){ let v=document.cookie.match('(^|;) ?'+n+'=([^;]*)(;|$)'); return v?v[2]:null; }

function renderCart() {
  fetch('/cart/data/').then(r=>r.json()).then(d=>updateCartCount(d.total_items));
  const cart = JSON.parse(localStorage.getItem('__cart__') || '{}');
  // We'll pull from session via a small endpoint
}

// Build cart UI from session (via cart_data or a dedicated endpoint)
// We'll use a simple approach: read cart from server by doing a page-data fetch
async function loadCart() {
  // We embed cart in page context via a hidden script trick
  // Instead, call a simple JSON endpoint
  const resp = await fetch('/cart/items/').catch(()=>null);
  if (!resp || !resp.ok) {
    document.getElementById('cart-empty-msg').style.display='block';
    return;
  }
  const data = await resp.json();
  renderItems(data.items, data.total);
}

function renderItems(items, total) {
  const container = document.getElementById('cart-items');
  container.innerHTML = '';
  if (!items || items.length === 0) {
    document.getElementById('cart-empty-msg').style.display='block';
    document.getElementById('cart-summary').style.display='none';
    return;
  }
  document.getElementById('cart-empty-msg').style.display='none';
  document.getElementById('cart-summary').style.display='block';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.id = 'item-'+item.id;
    div.innerHTML = `
      ${item.image_url
        ? `<img class="item-img" src="${item.image_url}" alt="${item.name}">`
        : `<div class="item-ph">${item.name[0]}</div>`}
      <div>
        <div class="item-name">${item.name}</div>
        <div class="item-price">$${item.price} each</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="updateQty('${item.id}', ${item.quantity-1})">−</button>
        <span class="qty-val">${item.quantity}</span>
        <button class="qty-btn" onclick="updateQty('${item.id}', ${item.quantity+1})">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="item-total" id="total-${item.id}">$${(item.price * item.quantity).toFixed(2)}</span>
        <button class="remove-btn" onclick="removeItem('${item.id}')" title="Remove">×</button>
      </div>
    `;
    container.appendChild(div);
  });
  document.getElementById('subtotal').textContent = '$'+total;
  document.getElementById('total').textContent = '$'+total;
}

function updateQty(pid, qty) {
  fetch('/cart/update/', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify({product_id:pid, quantity:qty})
  }).then(r=>r.json()).then(d=>{
    updateCartCount(d.total_items);
    loadCart();
  });
}

function removeItem(pid) {
  fetch('/cart/remove/', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify({product_id:pid})
  }).then(r=>r.json()).then(d=>{
    updateCartCount(d.total_items);
    loadCart();
  });
}

loadCart();
</script>
{% endblock %}
